version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        # Env vars set in the Amplify console are available here. Server-only
        # vars are inlined into the server bundle by next.config.js `env`.
        - npm run build
  artifacts:
    # Next.js SSR on Amplify: the build output is .next, not out/.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
